<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Savva Team — Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0c0c0c; --bg2:#141414; --surface:#1a1a1a; --surface2:#222;
  --border:#2a2a2a; --border2:#363636;
  --text:#f0f0f0; --muted:#888; --muted2:#aaa;
  --accent:oklch(72% 0.22 145);
  --accent-dim:oklch(72% 0.22 145 / 0.15);
  --accent-soft:oklch(72% 0.22 145 / 0.08);
  --danger:#ef5b5b; --warn:#e2b144; --info:#5b9cef;
  --font-head:'Big Shoulders Display',sans-serif;
  --font-body:'Inter',sans-serif;
  --font-mono:'JetBrains Mono',monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--text);font-family:var(--font-body);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;color:inherit}

/* LOGIN */
#loginScreen{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:100;padding:24px}
#loginScreen::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse 60% 50% at 50% 30%,oklch(72% 0.22 145 / 0.12),transparent 70%);pointer-events:none}
.login-card{position:relative;width:100%;max-width:380px;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:40px 32px;box-shadow:0 30px 80px rgba(0,0,0,0.5)}
.login-logo{font-family:var(--font-head);font-size:26px;font-weight:800;letter-spacing:0.04em;margin-bottom:6px}
.login-logo span{color:var(--accent)}
.login-sub{color:var(--muted);font-size:12px;letter-spacing:0.18em;text-transform:uppercase;margin-bottom:32px}
.login-field{display:flex;flex-direction:column;gap:8px;margin-bottom:18px}
.login-field label{font-size:11px;letter-spacing:0.12em;text-transform:uppercase;color:var(--muted);font-weight:600}
.login-field input{background:var(--bg2);border:1px solid var(--border);border-radius:8px;padding:12px 14px;color:var(--text);font-size:14px;outline:none;transition:border-color .2s}
.login-field input:focus{border-color:var(--accent)}
.login-btn{width:100%;background:var(--accent);color:var(--bg);border:none;padding:14px;border-radius:8px;font-weight:700;font-size:13px;letter-spacing:0.1em;text-transform:uppercase;margin-top:10px;transition:transform .2s,box-shadow .2s}
.login-btn:hover{transform:translateY(-1px);box-shadow:0 10px 30px oklch(72% 0.22 145 / 0.4)}
.login-error{margin-top:12px;font-size:12px;color:var(--danger);text-align:center;display:none}
.login-error.show{display:block}

/* LAYOUT */
#app{display:flex;min-height:100vh}
#app.hidden{display:none}

/* SIDEBAR */
.sidebar{width:240px;background:var(--bg2);border-right:1px solid var(--border);padding:22px 14px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh}
.sidebar-logo{font-family:var(--font-head);font-size:22px;font-weight:800;letter-spacing:0.04em;padding:6px 10px 22px;border-bottom:1px solid var(--border);margin-bottom:14px}
.sidebar-logo span{color:var(--accent)}
.nav-section{font-size:9px;letter-spacing:0.18em;text-transform:uppercase;color:var(--muted);padding:14px 10px 6px;font-weight:600}
.nav-item{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:8px;color:var(--muted2);font-size:13px;font-weight:500;cursor:pointer;transition:all .2s;border:none;background:transparent;width:100%;text-align:left}
.nav-item:hover{background:var(--surface);color:var(--text)}
.nav-item.active{background:var(--accent-dim);color:var(--accent)}
.nav-item .icon{width:16px;height:16px;display:inline-flex;align-items:center;justify-content:center;font-size:14px;opacity:.85}
.nav-item .badge{margin-left:auto;background:var(--accent);color:var(--bg);font-size:10px;font-weight:700;padding:2px 7px;border-radius:10px;min-width:18px;text-align:center}
.sidebar-footer{margin-top:auto;padding:14px 10px;border-top:1px solid var(--border);display:flex;align-items:center;gap:10px}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--accent);color:var(--bg);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px}
.user-info{display:flex;flex-direction:column;line-height:1.3;font-size:12px}
.user-info strong{color:var(--text);font-size:13px}
.user-info span{color:var(--muted);font-size:11px}
.logout-btn{margin-left:auto;background:none;border:1px solid var(--border);color:var(--muted);width:28px;height:28px;border-radius:6px;font-size:12px;display:flex;align-items:center;justify-content:center}
.logout-btn:hover{color:var(--accent);border-color:var(--accent)}

/* MAIN */
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;background:rgba(12,12,12,0.85);backdrop-filter:blur(12px);border-bottom:1px solid var(--border);padding:14px 32px;display:flex;align-items:center;gap:20px;z-index:10}
.topbar-search{flex:1;max-width:480px;position:relative}
.topbar-search input{width:100%;background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:10px 14px 10px 38px;font-size:13px;color:var(--text);outline:none;transition:border-color .2s}
.topbar-search input:focus{border-color:var(--accent)}
.topbar-search::before{content:'⌕';position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:16px}
.topbar-actions{margin-left:auto;display:flex;align-items:center;gap:10px}
.icon-btn{background:var(--surface);border:1px solid var(--border);width:36px;height:36px;border-radius:8px;color:var(--text);display:flex;align-items:center;justify-content:center;font-size:15px;position:relative;transition:all .2s}
.icon-btn:hover{border-color:var(--accent);color:var(--accent)}
.icon-btn .dot{position:absolute;top:6px;right:6px;width:7px;height:7px;border-radius:50%;background:var(--accent)}

.content{padding:28px 32px 60px;flex:1}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:28px;gap:20px;flex-wrap:wrap}
.page-title{font-family:var(--font-head);font-size:42px;font-weight:800;letter-spacing:0.02em;line-height:1}
.page-sub{color:var(--muted);font-size:13px;margin-top:6px}
.page-actions{display:flex;gap:10px}
.btn{display:inline-flex;align-items:center;gap:8px;padding:9px 16px;border-radius:8px;font-size:12px;font-weight:600;letter-spacing:0.04em;border:1px solid var(--border);background:var(--surface);color:var(--text);transition:all .2s}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn-primary{background:var(--accent);color:var(--bg);border-color:var(--accent)}
.btn-primary:hover{background:oklch(78% 0.22 145);color:var(--bg);box-shadow:0 8px 24px oklch(72% 0.22 145 / 0.35)}
.btn-danger{color:var(--danger);border-color:rgba(239,91,91,0.3)}
.btn-danger:hover{background:rgba(239,91,91,0.1);color:var(--danger);border-color:var(--danger)}

/* KPI */
.kpi-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:28px}
.kpi{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:20px;position:relative;overflow:hidden;transition:border-color .2s}
.kpi:hover{border-color:var(--border2)}
.kpi-label{font-size:10px;letter-spacing:0.16em;text-transform:uppercase;color:var(--muted);font-weight:600}
.kpi-value{font-family:var(--font-head);font-size:42px;font-weight:800;line-height:1.05;margin-top:10px}
.kpi-delta{font-size:11px;font-weight:600;margin-top:8px;display:flex;align-items:center;gap:6px}
.kpi-delta.up{color:var(--accent)}
.kpi-delta.down{color:var(--danger)}
.kpi-spark{position:absolute;right:12px;bottom:12px;opacity:.6}

/* CHART */
.row-grid{display:grid;grid-template-columns:2fr 1fr;gap:16px;margin-bottom:28px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:22px;overflow:hidden}
.card-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;gap:14px}
.card-title{font-size:14px;font-weight:600;letter-spacing:0.02em}
.card-sub{font-size:11px;color:var(--muted);margin-top:3px}
.tabs{display:flex;gap:4px;background:var(--bg2);padding:3px;border-radius:6px;font-size:11px}
.tab{padding:5px 12px;border-radius:4px;color:var(--muted);cursor:pointer;border:none;background:transparent;transition:all .2s}
.tab.active{background:var(--surface2);color:var(--text)}

/* TABLE */
.table-wrap{background:var(--surface);border:1px solid var(--border);border-radius:12px;overflow:hidden}
table{width:100%;border-collapse:collapse;font-size:13px}
th{background:var(--bg2);text-align:left;padding:12px 16px;font-size:10px;letter-spacing:0.14em;text-transform:uppercase;color:var(--muted);font-weight:600;border-bottom:1px solid var(--border)}
td{padding:14px 16px;border-bottom:1px solid var(--border);vertical-align:middle}
tbody tr{transition:background .15s}
tbody tr:hover{background:var(--bg2)}
tbody tr:last-child td{border-bottom:none}
.tag{display:inline-flex;padding:3px 9px;border-radius:6px;font-size:10px;font-weight:600;letter-spacing:0.06em;text-transform:uppercase}
.tag-new{background:rgba(91,156,239,0.15);color:var(--info)}
.tag-progress{background:rgba(226,177,68,0.15);color:var(--warn)}
.tag-done{background:var(--accent-dim);color:var(--accent)}
.tag-active{background:var(--accent-dim);color:var(--accent)}
.tag-paused{background:rgba(136,136,136,0.15);color:var(--muted2)}
.tag-elite{background:linear-gradient(90deg,oklch(72% 0.22 145 / 0.2),oklch(72% 0.22 145 / 0.05));color:var(--accent);border:1px solid oklch(72% 0.22 145 / 0.3)}
.row-actions{display:flex;gap:6px;opacity:0;transition:opacity .2s}
tbody tr:hover .row-actions{opacity:1}
.tiny-btn{width:28px;height:28px;border-radius:6px;background:transparent;border:1px solid var(--border);color:var(--muted);display:flex;align-items:center;justify-content:center;font-size:12px;transition:all .2s}
.tiny-btn:hover{border-color:var(--accent);color:var(--accent)}
.tiny-btn.danger:hover{border-color:var(--danger);color:var(--danger)}

/* TOOLBAR */
.toolbar{display:flex;gap:10px;margin-bottom:18px;flex-wrap:wrap;align-items:center}
.toolbar input,.toolbar select{background:var(--surface);border:1px solid var(--border);padding:8px 12px;border-radius:8px;color:var(--text);font-size:13px;outline:none;transition:border-color .2s}
.toolbar input:focus,.toolbar select:focus{border-color:var(--accent)}
.toolbar input{flex:1;min-width:200px;max-width:340px}
.chip-group{display:flex;gap:6px;background:var(--surface);padding:3px;border-radius:8px;border:1px solid var(--border)}
.chip{padding:6px 14px;border-radius:6px;color:var(--muted);font-size:12px;font-weight:500;cursor:pointer;border:none;background:transparent;transition:all .2s}
.chip.active{background:var(--bg2);color:var(--text)}
.spacer{flex:1}

/* CONTENT EDITOR */
.editor-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.editor-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:24px}
.editor-card h3{font-family:var(--font-head);font-size:24px;font-weight:800;margin-bottom:4px}
.editor-card .editor-cat{font-size:10px;letter-spacing:0.16em;text-transform:uppercase;color:var(--muted);margin-bottom:18px}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.field label{font-size:10px;letter-spacing:0.12em;text-transform:uppercase;color:var(--muted);font-weight:600}
.field input,.field textarea,.field select{background:var(--bg2);border:1px solid var(--border);border-radius:6px;padding:10px 12px;color:var(--text);font-size:13px;outline:none;font-family:inherit;transition:border-color .2s}
.field input:focus,.field textarea:focus,.field select:focus{border-color:var(--accent)}
.field textarea{resize:vertical;min-height:74px;line-height:1.5}
.editor-actions{display:flex;gap:10px;margin-top:8px}

/* DETAIL DRAWER */
.drawer-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:50;opacity:0;pointer-events:none;transition:opacity .25s}
.drawer-overlay.open{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;width:440px;max-width:100vw;height:100vh;background:var(--bg2);border-left:1px solid var(--border);z-index:51;transform:translateX(100%);transition:transform .3s cubic-bezier(0.22,1,0.36,1);display:flex;flex-direction:column}
.drawer.open{transform:translateX(0)}
.drawer-head{padding:22px 26px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.drawer-head h3{font-family:var(--font-head);font-size:24px;font-weight:800}
.drawer-body{flex:1;overflow-y:auto;padding:22px 26px}
.drawer-row{padding:12px 0;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;gap:14px}
.drawer-row:last-child{border:none}
.drawer-row .lbl{font-size:11px;letter-spacing:0.1em;text-transform:uppercase;color:var(--muted);font-weight:600}
.drawer-row .val{font-size:14px;color:var(--text);text-align:right}
.drawer-foot{padding:18px 26px;border-top:1px solid var(--border);display:flex;gap:10px}

/* TOAST */
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--surface);border:1px solid var(--accent);border-radius:8px;padding:12px 22px;font-size:13px;color:var(--text);box-shadow:0 20px 50px rgba(0,0,0,0.5);transition:transform .35s cubic-bezier(0.22,1,0.36,1);z-index:200}
#toast.show{transform:translateX(-50%) translateY(0)}

/* RESPONSIVE */
@media (max-width:960px){
  .sidebar{position:fixed;left:-260px;top:0;z-index:30;transition:left .3s;box-shadow:0 0 40px rgba(0,0,0,0.4)}
  .sidebar.open{left:0}
  .kpi-grid{grid-template-columns:repeat(2,1fr)}
  .row-grid{grid-template-columns:1fr}
  .editor-grid{grid-template-columns:1fr}
  .topbar{padding:12px 18px}
  .content{padding:20px 18px 40px}
  .page-title{font-size:32px}
  .menu-trigger{display:flex !important}
}
.menu-trigger{display:none;width:36px;height:36px;background:var(--surface);border:1px solid var(--border);border-radius:8px;color:var(--text);align-items:center;justify-content:center;font-size:16px}

@media (max-width:600px){
  .kpi-grid{grid-template-columns:1fr}
  .topbar-search{display:none}
  table{font-size:12px}
  th,td{padding:10px 12px}
  .drawer{width:100%}
}

/* misc */
.empty{padding:60px 40px;text-align:center;color:var(--muted)}
.empty .glyph{font-size:42px;opacity:.4;margin-bottom:14px}
.hidden{display:none !important}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="loginScreen">
  <form class="login-card" onsubmit="event.preventDefault();handleLogin();">
    <div class="login-logo">SAVVA<span>.</span>TEAM</div>
    <div class="login-sub">Admin Panel</div>
    <div class="login-field">
      <label for="loginPass">Пароль доступа</label>
      <input id="loginPass" type="password" placeholder="Введите секретный ключ" autocomplete="current-password" />
    </div>
    <button type="submit" class="login-btn">Войти</button>
    <div class="login-error" id="loginError">Неверный пароль</div>
  </form>
</div>

<!-- APP -->
<div id="app" class="hidden">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-logo">SAVVA<span>.</span>TEAM</div>
    <button class="nav-item active" data-page="dashboard"><span class="icon">▦</span>Дашборд</button>
    <button class="nav-item" data-page="inbox"><span class="icon">✉</span>Заявки<span class="badge" id="inboxBadge">0</span></button>
    <button class="nav-item" data-page="students"><span class="icon">◉</span>Ученики</button>
    <div class="nav-section">Контент лендинга</div>
    <button class="nav-item" data-page="texts"><span class="icon">¶</span>Тексты</button>
    <button class="nav-item" data-page="media"><span class="icon">▶</span>Видео и медиа</button>
    <button class="nav-item" data-page="programs"><span class="icon">◈</span>Программы</button>
    <button class="nav-item" data-page="schedule"><span class="icon">▤</span>Расписание</button>
    <button class="nav-item" data-page="bookings"><span class="icon">✔</span>Записи</button>
    <button class="nav-item" data-page="prices"><span class="icon">₽</span>Цены</button>
    <button class="nav-item" data-page="testimonials"><span class="icon">"</span>Отзывы</button>
    <button class="nav-item" data-page="coaches"><span class="icon">★</span>Тренеры</button>
    <div class="sidebar-footer">
      <div class="avatar">С</div>

      <button class="logout-btn" onclick="handleLogout()" title="Выход">⎋</button>
    </div>
  </aside>

  <main class="main">
    <div class="topbar">
      <button class="menu-trigger" onclick="document.getElementById('sidebar').classList.toggle('open')">≡</button>
      <div class="topbar-search">
        <input type="text" placeholder="Поиск по заявкам, ученикам, контенту…" id="globalSearch" />
      </div>
      <div class="topbar-actions">
        <button class="icon-btn" title="Уведомления">⌒<span class="dot"></span></button>
        <button class="icon-btn" title="Помощь">?</button>
      </div>
    </div>

    <div class="content" id="pageContent"></div>
  </main>
</div>

<!-- DRAWER -->
<div class="drawer-overlay" id="drawerOverlay" onclick="closeDrawer()"></div>
<aside class="drawer" id="drawer">
  <div class="drawer-head"><h3 id="drawerTitle">Заявка</h3>
    <button class="tiny-btn" onclick="closeDrawer()">✕</button>
  </div>
  <div class="drawer-body" id="drawerBody"></div>
  <div class="drawer-foot" id="drawerFoot"></div>
</aside>

<div id="toast"></div>

function loadStore(){
  let s=null;
  try{const raw=localStorage.getItem(STORE_KEY);if(raw)s=JSON.parse(raw)}catch(e){}
  if(!s)s=JSON.parse(JSON.stringify(SEED));
  ['students','programs','prices','testimonials','coaches'].forEach(k=>{if(!Array.isArray(s[k]))s[k]=JSON.parse(JSON.stringify(SEED[k]||[]))});
  ['texts','media','schedule'].forEach(k=>{if(!s[k]||typeof s[k]!=='object')s[k]=JSON.parse(JSON.stringify(SEED[k]||{}))});

}

function normalizeLeads(raw){
  return raw.map(l=>({...l, message:l.comment||'', date:l.created_at||''}));
}

async function uploadToServer(file){
  const fd = new FormData();
  fd.append('file', file);
  const res = await fetch('/api/upload?secret='+encodeURIComponent(adminSecret), { method:'POST', body:fd });
  if(!res.ok) throw new Error('Upload failed');
  return (await res.json()).url;
}

async function fetchLeadsAndStats(secret){
  const [leadsRes, statsRes, contentRes] = await Promise.all([
    fetch('/api/leads?secret='+encodeURIComponent(secret)),
    fetch('/api/stats?secret='+encodeURIComponent(secret)),
    fetch('/api/content'),
  ]);
  if(!leadsRes.ok) return false;
  serverLeads = normalizeLeads(await leadsRes.json());
  if(statsRes.ok) serverStats = await statsRes.json();
  if(contentRes.ok){
    const c = await contentRes.json();
    if(!state.texts) state.texts = {};
    Object.assign(state.texts, c);
    // Мержим медиа-ключи в state.media
    if(!state.media) state.media = {};
    ['hero_video_url','showreel_url','showreel_poster','showreel_caption'].forEach(k=>{ if(c[k]!=null) state.media[k]=c[k]; });
    // Мержим все поля тренеров из content API
    if(state.coaches) state.coaches.forEach(co=>{
      const n = co.id;
      const fields = ['name','eyebrow','bio','photo','photo2','video',
        'stat1_num','stat1_label','stat2_num','stat2_label','stat3_num','stat3_label'];
      fields.forEach(f=>{ const v=c['coach'+n+'_'+f]; if(v!=null) co[f]=v; });
    });
    if(c.schedule_data){ try{ const s=JSON.parse(c.schedule_data); if(s&&Array.isArray(s.days)&&Array.isArray(s.rows)) state.schedule=s; }catch(e){} }
    saveStore();
  }
  return true;
}

async function handleLogin(){
  const pass=document.getElementById('loginPass').value.trim();
  if(!pass)return;
  const errEl=document.getElementById('loginError');
  errEl.classList.remove('show');

  }
}

/* ============= CSV ============= */
function exportCSV(rows,filename){
  if(!rows.length){toast('Нет данных для экспорта');return}
  const keys=Object.keys(rows[0]);
  const esc=v=>{const s=String(v??'');return /[",\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s};
  const csv=[keys.join(','),...rows.map(r=>keys.map(k=>esc(r[k])).join(','))].join('\n');
  const blob=new Blob(['﻿'+csv],{type:'text/csv;charset=utf-8'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=filename;a.click();
  URL.revokeObjectURL(a.href);
  toast('CSV экспортирован');
}

function kpiCard(label,value,delta,dir,spark){
  return `<div class="kpi"><div class="kpi-label">${label}</div><div class="kpi-value">${value}</div>${delta?`<div class="kpi-delta ${dir}">${dir==='up'?'▲':'▼'} ${delta}</div>`:''}<div class="kpi-spark">${spark}</div></div>`;
}
function sparkline(data){
  const w=80,h=28,max=Math.max(...data,1),min=Math.min(...data);
  const pts=data.map((v,i)=>`${(i/(data.length-1))*w},${h-((v-min)/(max-min||1))*h}`).join(' ');
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}"><polyline points="${pts}" fill="none" stroke="oklch(72% 0.22 145)" stroke-width="1.5"/></svg>`;
}
function sparklineFromByDay(byDay){
  const data=byDay.map(d=>d.n);
  if(!data.length)data.push(0);
  return sparkline(data);
}

/* Строим 7-дневный диапазон, заполняя пустые дни нулями */
function last7days(){
  const days=[];
  for(let i=6;i>=0;i--){
    const d=new Date();d.setDate(d.getDate()-i);
    days.push(d.toISOString().slice(0,10));
  }
  return days;
}
function barChartFromStats(byDay){
  const map={};byDay.forEach(d=>map[d.day]=d.n);
  const days=last7days();
  const data=days.map(d=>({day:d,n:map[d]||0}));
  const max=Math.max(...data.map(d=>d.n),1);
  const W=600,H=220,pad=30;
  const bw=(W-pad*2)/data.length-10;
  let bars='';
  data.forEach((d,i)=>{
    const x=pad+i*((W-pad*2)/data.length)+5;
    const bh=Math.max(4,((d.n/max)*(H-pad-30)));
    const label=d.day.slice(5).replace('-','.');
    bars+=`<rect x="${x}" y="${H-pad-bh}" width="${bw}" height="${bh}" rx="4" fill="oklch(72% 0.22 145)" opacity="${0.45+0.55*(d.n/max)}"/>`;
    bars+=`<text x="${x+bw/2}" y="${H-12}" text-anchor="middle" font-size="10" fill="#888" font-family="Inter">${label}</text>`;
    if(d.n>0)bars+=`<text x="${x+bw/2}" y="${H-pad-bh-6}" text-anchor="middle" font-size="11" fill="#f0f0f0" font-family="Inter" font-weight="600">${d.n}</text>`;
  });
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block">${bars}</svg>`;
}
function donutChart(st){
  const data=[
    {l:'Новые',    v:st.new,      c:'#5b9cef'},
    {l:'В работе', v:st.progress, c:'#e2b144'},
    {l:'Закрытые', v:st.done,     c:'oklch(72% 0.22 145)'},
  ].filter(d=>d.v>0);
  if(!data.length)data.push({l:'Нет заявок',v:1,c:'#333'});
  const total=data.reduce((s,d)=>s+d.v,0);
  const cx=80,cy=80,r=58,sw=18;let acc=0;
  let arcs='';
  data.forEach(d=>{
    const start=acc/total*Math.PI*2-Math.PI/2;
    acc+=d.v;
    const end=acc/total*Math.PI*2-Math.PI/2;
    const large=d.v/total>0.5?1:0;
    const x1=cx+r*Math.cos(start),y1=cy+r*Math.sin(start);
    const x2=cx+r*Math.cos(end),y2=cy+r*Math.sin(end);
    arcs+=`<path d="M ${x1} ${y1} A ${r} ${r} 0 ${large} 1 ${x2} ${y2}" fill="none" stroke="${d.c}" stroke-width="${sw}"/>`;
  });
  const legend=data.map(d=>`<div style="display:flex;align-items:center;gap:10px;font-size:12px;padding:6px 0"><div style="width:10px;height:10px;border-radius:2px;background:${d.c}"></div><span style="flex:1">${d.l}</span><strong>${d.v}</strong></div>`).join('');
  return `<div style="display:flex;align-items:center;gap:24px;flex-wrap:wrap"><svg width="160" height="160" viewBox="0 0 160 160">${arcs}<text x="80" y="78" text-anchor="middle" font-family="Big Shoulders Display" font-size="32" font-weight="800" fill="#f0f0f0">${st.total}</text><text x="80" y="96" text-anchor="middle" font-size="10" fill="#888" letter-spacing="1.5">ЗАЯВОК</text></svg><div style="flex:1;min-width:140px">${legend}</div></div>`;
}

async function setLeadStatus(id,status){
  try{
    const res=await fetch('/api/leads/'+id+'?secret='+encodeURIComponent(adminSecret),{
      method:'PATCH',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({status}),
    });
    if(!res.ok){toast('Ошибка обновления статуса');return}
    const lead=serverLeads.find(l=>l.id===id);
    if(lead)lead.status=status;
    if(serverStats){
      // пересчитываем счётчики локально до следующего полного refresh
      const oldStatus=lead?lead._prevStatus:'new';
      serverStats[oldStatus]=(serverStats[oldStatus]||1)-1;
      serverStats[status]=(serverStats[status]||0)+1;
    }
    updateBadges();
    renderInbox(document.getElementById('pageContent'));
    toast('Статус обновлён');
  }catch(e){toast('Ошибка соединения')}
}

let schOpenCell=null; // "ri:ci" ячейки с раскрытым блоком допуска

          <select data-sch="${ri}" data-c="${ci}" data-f="audience" style="width:100%;margin-bottom:4px">${SCH_AUD.map(o=>`<option value="${o[0]}" ${((cell.audience||'adult')===o[0])?'selected':''}>${o[1]}</option>`).join('')}</select>

          <select data-sch="${ri}" data-c="${ci}" data-f="coach_id" style="width:100%;margin-bottom:4px">${schCoachOptions(cell.coach_id)}</select>
          <input data-sch="${ri}" data-c="${ci}" data-f="capacity" type="number" min="1" placeholder="мест" value="${cell.capacity!=null?cell.capacity:''}" style="width:100%"/>
        </div>
      </td>`;}).join('')}
      <td style="vertical-align:top"><button class="btn btn-danger" onclick="delSchRow(${ri})">✕</button></td>
    </tr>`).join('')}</tbody></table></div>`;

function collectSchedule(){
  const sch=state.schedule;
  const g=(ri,ci,f)=>{const el=document.querySelector(`[data-sch="${ri}"][data-c="${ci}"][data-f="${f}"]`);return el?el.value.trim():''};
  // дни
  sch.days=sch.days.map((d,di)=>{const el=document.querySelector(`[data-schday="${di}"]`);return el?el.value.trim()||d:d});
  sch.rows.forEach((row,ri)=>{
    const t=document.querySelector(`[data-sch="${ri}"][data-f="time"]`); if(t)row.time=t.value.trim();
    row.cells=sch.days.map((_,ci)=>{
      const title=g(ri,ci,'title'); if(!title)return null;
      const prev=(row.cells&&row.cells[ci])||{};
      const lmin=parseFloat(g(ri,ci,'level_min')); const lmax=parseFloat(g(ri,ci,'level_max')); const cap=parseInt(g(ri,ci,'capacity'),10);
      return {
        id: prev.id||genSchId(),
        title, meta:g(ri,ci,'meta'),
        cat:g(ri,ci,'cat')||'mixed',
        level_min: isNaN(lmin)?1:lmin,
        level_max: isNaN(lmax)?7:lmax,
        audience:g(ri,ci,'audience')||'adult',
        gender:g(ri,ci,'gender')||'mixed',
        coach_id:g(ri,ci,'coach_id')||'',
        capacity: isNaN(cap)?8:cap,
      };
    });
  });
}
function toggleSchCell(ri,ci){collectSchedule();const key=ri+':'+ci;schOpenCell=(schOpenCell===key)?null:key;renderSchedule(document.getElementById('pageContent'))}
function addSchRow(){collectSchedule();state.schedule.rows.push({time:'00:00–00:00',cells:state.schedule.days.map(()=>null)});renderSchedule(document.getElementById('pageContent'))}
function delSchRow(i){collectSchedule();if(!confirm('Удалить строку?'))return;state.schedule.rows.splice(i,1);renderSchedule(document.getElementById('pageContent'))}
function addSchDay(){collectSchedule();state.schedule.days.push('ДЕНЬ');state.schedule.rows.forEach(r=>{(r.cells=r.cells||[]).push(null)});renderSchedule(document.getElementById('pageContent'))}
function delSchDay(){collectSchedule();if(state.schedule.days.length<=1)return;if(!confirm('Удалить последний день?'))return;state.schedule.days.pop();state.schedule.rows.forEach(r=>{if(r.cells)r.cells.pop()});renderSchedule(document.getElementById('pageContent'))}
async function saveSchedule(){
  collectSchedule();
  const res=await fetch('/api/content?secret='+encodeURIComponent(adminSecret),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({schedule_data:JSON.stringify(state.schedule)})});
  if(res.ok){saveStore();toast('Расписание опубликовано')}else{toast('Ошибка сохранения')}
}

function isYouTube(u){return /youtube\.com|youtu\.be/.test(u||'')}
function ytEmbed(u){const m=u.match(/(?:youtu\.be\/|v=)([\w-]+)/);return m?`https://www.youtube.com/embed/${m[1]}`:u}
async function saveMedia(){
  if(!state.media)state.media={};
  ['showreel_url','showreel_poster','showreel_caption','hero_video_url'].forEach(k=>{
    const el=document.getElementById('med_'+k);if(el)state.media[k]=el.value;
  });
  saveStore();
  await fetch('/api/content?secret='+encodeURIComponent(adminSecret),{
    method:'POST', headers:{'Content-Type':'application/json'},
    body:JSON.stringify({
      hero_video_url:   state.media.hero_video_url||'',
      showreel_url:     state.media.showreel_url||'',

      showreel_caption: state.media.showreel_caption||'',
    })
  });
  toast('Медиа сохранено');
  renderMedia(document.getElementById('pageContent'));
}

  state.media[key]='';

  toast('Удалено');
}

async function loadCoachChats(){
  try{
    const r=await fetch('/api/coaches?secret='+encodeURIComponent(adminSecret));
    if(r.ok){const list=await r.json();(state.coaches||[]).forEach(co=>{const m=list.find(x=>x.slot==='coach'+co.id);if(m)co.telegram_chat_id=m.telegram_chat_id||'';});}
  }catch(e){}
}
async function saveCoachChat(id){
  const el=document.getElementById('coachChat'+id); if(!el)return;
  const val=el.value.trim();
  const r=await fetch('/api/coaches/coach'+id+'?secret='+encodeURIComponent(adminSecret),{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({telegram_chat_id:val})});
  if(r.ok){const co=state.coaches.find(x=>x.id===id);if(co)co.telegram_chat_id=val;toast('chat_id сохранён');}else{toast('Ошибка');}
}
async function saveCoach(id){
  const co=state.coaches.find(x=>x.id===id);if(!co)return;
  document.querySelectorAll(`[data-cid="${id}"]`).forEach(i=>{
    if((i.dataset.key==='photo'||i.dataset.key==='video')&&!i.value) return;
    co[i.dataset.key]=i.value;
  });
  saveStore();
  const n=id;
  const payload={
    ['coach'+n+'_name']:     co.name||'',
    ['coach'+n+'_eyebrow']:  co.eyebrow||'',
    ['coach'+n+'_bio']:      co.bio||'',
    ['coach'+n+'_stat1_num']:co.stat1_num||'',
    ['coach'+n+'_stat1_label']:co.stat1_label||'',
    ['coach'+n+'_stat2_num']:co.stat2_num||'',
    ['coach'+n+'_stat2_label']:co.stat2_label||'',
    ['coach'+n+'_stat3_num']:co.stat3_num||'',
    ['coach'+n+'_stat3_label']:co.stat3_label||'',
    ['coach'+n+'_photo']:    co.photo||'',
    ['coach'+n+'_photo2']:   co.photo2||'',
    ['coach'+n+'_video']:    co.video||'',
  };
  await fetch('/api/content?secret='+encodeURIComponent(adminSecret),{
    method:'POST', headers:{'Content-Type':'application/json'},
    body:JSON.stringify(payload)
  });
  renderCoaches(document.getElementById('pageContent'));
  toast('Сохранено');
}
function delCoach(id){if(!confirm('Удалить тренера?'))return;state.coaches=state.coaches.filter(c=>c.id!==id);saveStore();renderCoaches(document.getElementById('pageContent'));toast('Удалено')}
function addCoach(){const id=Math.max(0,...state.coaches.map(c=>c.id))+1;state.coaches.push({id,name:'Новый тренер',role:'Junior Coach',level:'B',bio:'',photo:'',video:''});saveStore();renderCoaches(document.getElementById('pageContent'))}
async function handleCoachVideo(e,id){
  const f=e.target.files[0];if(!f)return;
  const co=state.coaches.find(x=>x.id===id);if(!co)return;
  toast('Загрузка...');
  try{
    const url=await uploadToServer(f);
    co.video=url;
    saveStore();
    toast('Видео загружено на сервер');
    renderCoaches(document.getElementById('pageContent'));
  }catch(err){toast('Ошибка загрузки')}
}
async function clearCoachVideo(id){
  const co=state.coaches.find(x=>x.id===id);if(!co)return;
  co.video='';
  saveStore();
  await fetch('/api/content?secret='+encodeURIComponent(adminSecret),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({['coach'+id+'_video']:''})});
  renderCoaches(document.getElementById('pageContent'));
  toast('Видео удалено');
}

/* ============= UTILS ============= */
function escapeHtml(s){return String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function escapeAttr(s){return String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}

/* GLOBAL SEARCH */
document.getElementById('globalSearch').addEventListener('keydown',e=>{
  if(e.key==='Enter'){const q=e.target.value.trim();if(!q)return;
    if(/\d/.test(q)||/[+]/.test(q))navigate('inbox');
    else navigate('students');
    setTimeout(()=>{const inp=document.querySelector('#leadSearch,#stSearch');if(inp){inp.value=q;inp.dispatchEvent(new Event('input'))}},50);
  }
});
</script>
